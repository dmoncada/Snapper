[project]
name = "snapper-api"
version = "0.1.0"
description = "Metadata API for Snapper"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.fastapi]
entrypoint = "snapper_api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
